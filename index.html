<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizwan AI - Free Video Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0a0a1a; --bg2:#1a1a3a; --blue:#00d4ff; --purple:#a855f7; --green:#00ff88;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#fff;font-family:'Poppins',sans-serif;min-height:100vh;padding:20px}
.logo{font-size:40px;font-weight:700;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;padding:20px 0}
.subtitle{font-family:'Noto Nastaliq Urdu',serif;font-size:18px;color:#aaa;text-align:center;margin-bottom:30px}
.container{max-width:800px;margin:0 auto;background:rgba(21,21,42,0.8);padding:30px;border-radius:20px;border:1px solid #333;backdrop-filter:blur(10px)}
textarea{width:100%;height:120px;background:#0a0a1a;border:2px solid #333;color:#fff;padding:18px;border-radius:12px;font-size:16px;font-family:'Poppins';resize:none}
textarea:focus{outline:none;border-color:var(--blue)}
.btn{width:100%;padding:18px;background:linear-gradient(90deg,var(--blue),var(--purple));border:none;color:#fff;font-size:20px;font-weight:700;border-radius:14px;cursor:pointer;margin-top:15px;transition:0.3s}
.btn:hover{transform:scale(1.02)}
.btn:disabled{background:#333;cursor:not-allowed;transform:scale(1)}
#result{margin-top:20px}
video{width:100%;border-radius:15px;margin-top:15px;border:2px solid var(--blue)}
.loader{border:5px solid #333;border-top:5px solid var(--blue);border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin {0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }}
.note{color:#aaa;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="logo">🤖 رضوان اے</div>
<div class="subtitle">RIZWAN AI - Auto Video Generator</div>

<div class="container">
  <h2 style="text-align:center;margin-bottom:10px">AI Video Generator</h2>
  <p style="text-align:center;color:#aaa;margin-bottom:20px;font-family:'Noto Nastaliq Urdu'">جو لکھیں گے وہی ویڈیو بنے گی</p>
  
  <textarea id="prompt" placeholder="مثال: drone shot of lahore at sunset, cinematic"></textarea>
  <button id="btn" class="btn" onclick="makeVideo()">🎬 Generate Video</button>
  <div id="result"><p style="text-align:center;margin-top:15px;color:#888">آپ کی ویڈیو یہاں بنے گی</p></div>
  <p class="note">نوٹ: فری API ہے۔ روز 10 ویڈیو۔ 1 ویڈیو بننے میں 90 سیکنڈ لگتے ہیں</p>
</div>

<script>
async function makeVideo(){
  let p = document.getElementById('prompt').value;
  if(p==""){alert("پہلے پرامپٹ لکھیں"); return;}
  
  document.getElementById('btn').disabled = true;
  document.getElementById('result').innerHTML = '<div class="loader"></div><p style="text-align:center;color:var(--blue)">ویڈیو بن رہی ہے... براہ کرم 90 سیکنڈ ویٹ کریں</p>';
  
  try {
    // فری ویڈیو API
    let response = await fetch("https://api-inference.huggingface.co/models/stabilityai/stable-video-diffusion-img2vid-xt", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        inputs: p + ", smooth motion, 4k, cinematic"
      })
    });
    
    if(!response.ok) throw new Error("API Error");
    
    let blob = await response.blob();
    let videoUrl = URL.createObjectURL(blob);
    
    document.getElementById('result').innerHTML = `
      <p style="color:var(--green);text-align:center;font-size:18px">✅ ویڈیو تیار ہے!</p>
      <video controls autoplay loop src="${videoUrl}"></video>
    `;
  } catch(e) {
    document.getElementById('result').innerHTML = `<p style="color:red;text-align:center">❌ API کا کریڈٹ ختم ہو گیا۔ کل 12 بجے کے بعد دوبارہ ٹرائی کریں۔</p>`;
  }
  
  document.getElementById('btn').disabled = false;
}
</script>
</body>
</html>
