<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>Rizwan AI - 5s Video</title>
<style>
body{background:#050510;color:#fff;text-align:center;padding:20px}
h1{background:linear-gradient(90deg,#00ff88,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.box{max-width:600px;margin:20px auto;background:#101025;padding:25px;border-radius:20px}
textarea{width:100%;height:70px;background:#000;border:2px solid #333;color:#fff;padding:15px;border-radius:12px}
.btn{width:100%;padding:16px;background:#00ff88;border:none;color:#000;font-size:18px;font-weight:700;border-radius:12px;cursor:pointer}
video{width:100%;border-radius:15px;margin-top:15px;border:3px solid #00ff88}
</style>
</head>
<body>
<h1>🤖 رضوان اے - 5 سیکنڈ فری ویڈیو</h1>
<p>لامحدود بنائیں۔ روز۔ بغیر پیسے کے</p>

<div class="box">
  <textarea id="p" placeholder="مثال: a man running in lahore, cinematic"></textarea>
  <button id="btn" class="btn" onclick="make()">🎬 5 سیکنڈ ویڈیو بنائیں</button>
  <div id="r"></div>
  <p style="color:#ffaa00;font-size:12px">نوٹ: 2 منٹ میں بنے گی۔ کوئی لمٹ نہیں</p>
</div>

<script>
async function make(){
  let prompt = document.getElementById('p').value;
  if(prompt==""){alert("پرامپٹ لکھیں"); return;}
  document.getElementById('btn').disabled = true;
  document.getElementById('r').innerHTML = '<p>بن رہی ہے... 120 سیکنڈ</p>';
  
  let res = await fetch("https://api-inference.huggingface.co/models/stabilityai/stable-video-diffusion-img2vid-xt", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({inputs: prompt + ", smooth motion, cinematic, 4k"})
  });
  let blob = await res.blob();
  let url = URL.createObjectURL(blob);
  
  document.getElementById('r').innerHTML = `
    <p style="color:#0f0">✅ ویڈیو تیار!</p>
    <video controls autoplay loop src="${url}"></video>
    <a href="${url}" download="RizwanAI-5s.mp4" class="btn" style="display:block;text-decoration:none">📥 Download</a>
  `;
  document.getElementById('btn').disabled = false;
}
</script>
</body>
</html>
