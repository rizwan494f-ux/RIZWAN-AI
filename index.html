<!DOCTYPE html>
<html>
<head>
<title>Rizwan AI - Real Video</title>
<style>
body{background:#0a0a1a;color:#fff;text-align:center;padding:20px;font-family:'Poppins'}
.container{max-width:700px;margin:20px auto;background:#15152a;padding:25px;border-radius:15px}
textarea{width:100%;height:80px;background:#0a0a1a;border:2px solid #333;color:#fff;padding:15px;border-radius:10px}
.btn{width:100%;padding:16px;background:linear-gradient(90deg,#00d4ff,#a855f7);border:none;color:#fff;font-size:18px;font-weight:700;border-radius:12px;cursor:pointer;margin-top:15px}
video{width:100%;border-radius:15px;margin-top:15px}
</style>
</head>
<body>
<h2>🤖 رضوان اے - Real AI Video</h2>
<div class="container">
  <p>لکھیں: a man running, a car driving, waves crashing</p>
  <textarea id="prompt" placeholder="example: a man running on street"></textarea>
  <button class="btn" onclick="makeRealVideo()">🎬 Generate Real Video</button>
  <div id="result"></div>
  <p style="color:#ffaa00;font-size:12px">نوٹ: روز 5 فری۔ یہ اصلی ویڈیو بناتا ہے</p>
</div>

<script>
async function makeRealVideo(){
  let p = document.getElementById('prompt').value;
  if(p==""){alert("پرامپٹ لکھیں"); return;}
  
  document.getElementById('result').innerHTML = '<p style="color:#00d4ff">ویڈیو بن رہی ہے... 2 منٹ لگیں گے</p>';
  
  // Kling AI Free API
  let res = await fetch("https://api.klingai.com/v1/videos/text2video", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({prompt: p + ", smooth motion, 4k"})
  });
  
  let data = await res.json();
  let videoUrl = data.video_url; // یہاں ویڈیو کا لنک آئے گا
  
  document.getElementById('result').innerHTML = `
    <p style="color:#00ff88">✅ اصلی ویڈیو تیار!</p>
    <video controls autoplay loop src="${videoUrl}"></video>
  `;
}
</script>
</body>
</html>
