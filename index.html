<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizwan AI - Unlimited Video</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#0a0a1a,#1a1a3a);color:#fff;font-family:'Poppins',sans-serif;text-align:center;padding:20px}
.logo{font-size:40px;font-weight:700;background:linear-gradient(90deg,#00d4ff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.container{max-width:700px;margin:20px auto;background:rgba(21,21,42,0.8);padding:30px;border-radius:20px;border:1px solid #333}
textarea{width:100%;height:100px;background:#0a0a1a;border:2px solid #333;color:#fff;padding:15px;border-radius:12px;font-size:16px}
.btn{width:100%;padding:16px;background:linear-gradient(90deg,#00d4ff,#a855f7);border:none;color:#fff;font-size:18px;font-weight:700;border-radius:12px;cursor:pointer;margin-top:15px}
video{width:100%;border-radius:15px;margin-top:15px;border:2px solid #00d4ff}
.loader{border:5px solid #333;border-top:5px solid #00d4ff;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:15px auto}
@keyframes spin {100% {transform: rotate(360deg);}}
@keyframes zoom {0%{transform:scale(1)} 100%{transform:scale(1.2)}}
</style>
</head>
<body>
<div class="logo">🤖 رضوان اے</div>
<p style="font-family:'Noto Nastaliq Urdu';color:#aaa">لکھیں → امیج بنے گی → خود ویڈیو بن جائے گی</p>

<div class="container">
  <h2>Unlimited AI Video Generator</h2>
  <textarea id="prompt" placeholder="مثال: beautiful sunset in karachi sea"></textarea>
  <button id="btn" class="btn" onclick="makeVideo()">🎬 Generate Video</button>
  <div id="result"></div>
  <p style="color:#00ff88;font-size:12px;margin-top:10px">نوٹ: روز لامحدود۔ کوئی کریڈٹ ختم نہیں ہوگا</p>
</div>

<script>
async function makeVideo(){
  let p = document.getElementById('prompt').value;
  if(p==""){alert("پرامپٹ لکھیں"); return;}
  
  document.getElementById('btn').disabled = true;
  document.getElementById('result').innerHTML = '<div class="loader"></div><p style="color:#00d4ff">HD امیج بن رہی ہے...</p>';
  
  // Step 1: امیج بناؤ - یہ فری ہے
  let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ", 8k, cinematic, highly detailed")}?width=1024&height=576&nologo=true`;
  
  let img = new Image();
  img.onload = function(){
    document.getElementById('result').innerHTML = `
      <p style="color:#00ff88">✅ ویڈیو تیار!</p>
      <video autoplay loop muted playsinline style="animation: zoom 5s infinite alternate;">
        <source src="${imgUrl}" type="image/jpeg">
      </video>
      <p style="color:#aaa;font-size:12px">یہ امیج کو ہلا کر ویڈیو بنی ہے</p>
    `;
    document.getElementById('btn').disabled = false;
  }
  img.src = imgUrl;
}
</script>
</body>
</html>
